<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>

    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    /* Dynamic pulsing and flow animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .orb-anim-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-anim-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 240px;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashFlow 12s linear infinite;
    }
    .float-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .float-2 {
      animation: floatPillReverse 6s ease-in-out infinite;
    }
    .float-3 {
      animation: floatPill 7s ease-in-out infinite;
    }
  </style>

  <!-- Base Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="orb-anim-1" filter="url(#softGlow)">
    <circle cx="200" cy="90" r="130" fill="#0284c7" />
  </g>
  <g class="orb-anim-2" filter="url(#softGlow)">
    <circle cx="1020" cy="240" r="140" fill="#4f46e5" />
  </g>
  <circle cx="600" cy="330" r="160" fill="#0f766e" opacity="0.25" filter="url(#softGlow)" />

  <!-- Dynamic Network / Data Stream Lines -->
  <g opacity="0.35">
    <path class="flow-line" d="M -50 80 Q 300 240 600 90 T 1250 150" fill="none" stroke="url(#cyberGreen)" stroke-width="2" />
    <path class="flow-line" d="M -50 280 Q 350 120 700 270 T 1250 110" fill="none" stroke="url(#blueGlow)" stroke-width="2" style="animation-duration: 8s;" />
  </g>

  <!-- Corner Border Ambient Frame -->
  <rect x="12" y="12" width="1176" height="336" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- FOREGROUND CONTENT: Header Icon & Titles (Always on top) -->
  <g transform="translate(60, 45)">
    <!-- Small Category Chip -->
    <g>
      <rect width="210" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" />
      <text x="28" y="18" fill="#38bdf8" class="pill-text">MOBILE DATA PROTECTION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="url(#titleGrad)" class="title-text" filter="url(#glowEffect)">
      Awesome iOS &amp; Android Backup
    </text>

    <!-- Subtitle -->
    <text x="0" y="120" class="subtitle-text">
      The definitive ecosystem guide for enterprise EMM/UEM, self-hosted media backup,
    </text>
    <text x="0" y="146" class="subtitle-text">
      ADB snapshots, encrypted local sync, and forensic device recovery.
    </text>
  </g>

  <!-- Interactive / Floating Ecosystem Pills (Positioned cleanly at bottom to never obscure title) -->
  <g transform="translate(60, 260)">
    <!-- Pill 1: iOS Backup -->
    <g class="float-1" transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="22" cy="21" r="6" fill="#38bdf8" />
      <text x="38" y="26" fill="#f8fafc" class="pill-text">iOS idevicebackup2</text>
    </g>

    <!-- Pill 2: Android ADB & Root -->
    <g class="float-2" transform="translate(200, 0)">
      <rect width="190" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#00F5A0" stroke-width="1.2" />
      <circle cx="22" cy="21" r="6" fill="#00F5A0" />
      <text x="38" y="26" fill="#f8fafc" class="pill-text">Android Root &amp; ADB</text>
    </g>

    <!-- Pill 3: Self-Hosted Cloud -->
    <g class="float-3" transform="translate(410, 0)">
      <rect width="195" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="22" cy="21" r="6" fill="#818cf8" />
      <text x="38" y="26" fill="#f8fafc" class="pill-text">Immich &amp; Nextcloud</text>
    </g>

    <!-- Pill 4: Enterprise UEM -->
    <g class="float-1" transform="translate(625, 0)">
      <rect width="170" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="22" cy="21" r="6" fill="#f59e0b" />
      <text x="38" y="26" fill="#f8fafc" class="pill-text">Enterprise UEM/MDM</text>
    </g>

    <!-- Pill 5: E2EE Sync -->
    <g class="float-2" transform="translate(815, 0)">
      <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#ec4899" stroke-width="1.2" />
      <circle cx="22" cy="21" r="6" fill="#ec4899" />
      <text x="38" y="26" fill="#f8fafc" class="pill-text">E2EE Sync &amp; Rclone</text>
    </g>
  </g>
</svg>
